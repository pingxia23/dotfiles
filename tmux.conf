# Use a login zsh in tmux when available, matching iTerm2's normal shell on macOS.
if-shell '[ -x /bin/zsh ]' \
  'set -g default-shell /bin/zsh; set -g default-command "exec /bin/zsh -l"' \
  'set -g default-shell /bin/bash; set -g default-command "exec /bin/bash -l"'

# Use the local workspace signing-agent socket on Linux only.
if-shell '[ "$(uname -s)" = "Linux" ]' \
  'set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"; setenv -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"' \
  'set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY"'

# Enable mouse mode for scrollback in tmux.
set -g mouse on

# Enable OSC 52 clipboard integration (works over SSH without X11).
set -g set-clipboard on

# Copy selection to clipboard on mouse drag end (uses OSC 52 via set-clipboard).
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

set -g history-limit 50000

# Set terminal tab title to tmux session name.
set -g set-titles on
set -g set-titles-string "#{session_name}"

# macOS-only persistence across terminal closes/reboots. Auto-restore happens
# when tmux is started manually; tmux should not auto-launch a terminal at login.
if-shell '[ "$(uname -s)" = "Darwin" ]' \
  'set -g @plugin "tmux-plugins/tpm"; set -g @plugin "tmux-plugins/tmux-resurrect"; set -g @plugin "tmux-plugins/tmux-continuum"; set -g @continuum-restore "on"; set -g @continuum-boot "off"; set -g @resurrect-strategy-vim "session"; run "~/.tmux/plugins/tpm/tpm"'
